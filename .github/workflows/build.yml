name: Windows build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example v0.3.0); empty = build only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore OpenPad.csproj --locked-mode --configfile NuGet.Config
      - name: Build application
        run: dotnet publish OpenPad.csproj -c Release --no-restore -o artifacts/app
      - name: Audio smoke test
        shell: pwsh
        run: |
          $p = Start-Process ./artifacts/app/OpenPad.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw 'Audio smoke test failed' }
      - name: OPL package smoke test
        shell: pwsh
        run: |
          $p = Start-Process ./artifacts/app/OpenPad.exe -ArgumentList '--opl-test' -Wait -PassThru
          Get-Content opl-test.txt
          if ($p.ExitCode -ne 0) { throw 'OPL smoke test failed' }
      - name: Localization smoke test
        shell: pwsh
        run: |
          $p = Start-Process ./artifacts/app/OpenPad.exe -ArgumentList '--language-test' -Wait -PassThru
          Get-Content language-test.txt
          if ($p.ExitCode -ne 0) { throw 'Localization smoke test failed' }
      - name: Stability smoke test
        shell: pwsh
        run: |
          $p = Start-Process ./artifacts/app/OpenPad.exe -ArgumentList '--stability-test' -Wait -PassThru
          Get-Content stability-test.txt
          if ($p.ExitCode -ne 0) { throw 'Stability smoke test failed' }
      - name: Installer update and rollback tests
        shell: pwsh
        run: ./tests/Verify-Installer.ps1 -OutputDirectory ./artifacts/installer-verification
      - name: GitHub updater tests
        shell: pwsh
        run: |
          $p = Start-Process ./artifacts/app/OpenPad.exe -ArgumentList '--update-test' -Wait -PassThru
          Get-Content update-test.txt
          if ($p.ExitCode -ne 0) { throw 'Updater tests failed' }
      - name: Build installer
        shell: powershell
        run: ./Installer/Build.ps1
      - name: Collect installer and source
        shell: pwsh
        run: |
          Copy-Item ../OpenPad-Setup.exe artifacts/OpenPad-Setup.exe
          Copy-Item ../OpenPad-update-win-x64.zip artifacts/OpenPad-update-win-x64.zip
          git archive --format=zip --output=artifacts/OpenPad-source.zip HEAD
          [xml]$project = Get-Content OpenPad.csproj
          $version = $project.Project.PropertyGroup.Version
          $installerVersion = (Get-Item artifacts/OpenPad-Setup.exe).VersionInfo.ProductVersion
          if ($installerVersion -ne $version) { throw "Installer version $installerVersion differs from app $version" }
          Get-FileHash artifacts/OpenPad-Setup.exe, artifacts/OpenPad-source.zip, artifacts/OpenPad-update-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPad-Windows
          path: |
            artifacts/OpenPad-Setup.exe
            artifacts/OpenPad-source.zip
            artifacts/OpenPad-update-win-x64.zip
            artifacts/SHA256SUMS.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenPad-Windows
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' OpenPad.csproj)
          test "$RELEASE_TAG" = "v$VERSION" || { echo 'Tag and project version differ'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-files/* --target "$RELEASE_COMMIT" --title "OpenPad $VERSION" --generate-notes
